<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Food Recipe</title>
    <link rel="stylesheet" href="/static/adminapp/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #ff6be4;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background-color: #333;
            color: white;
            padding: 0.5rem;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        nav li {
            margin: 0 1rem;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }
        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th {
            border-bottom: 2px solid #ddd;
        }
        .btn {
            background-color: #b86bff;
            color: white;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }
        .btn-secondary {
            background-color: red;
        }
    </style>
</head>
<body>
    <header>
        <h1>Food Recipe</h1>
    </header>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/recipes/">Recipes</a></li>
            <li><a href="/categories/">Categories</a></li>
            <li><a href="/users/">Users</a></li>
            <li><a href="/about/">About</a></li>
            <li><a href="/contact/">Contact</a></li>
        </ul>
    </nav>
    <div class="container">
        <h2>All Users</h2>
        <form method="get" action="" style="margin-bottom:1.5rem; display:flex; gap:1rem; flex-wrap:wrap;">
            <input type="text" name="q" placeholder="Search users..." value="{{ request.GET.q }}" style="flex:1; padding:0.5rem;">
            <button type="submit" class="btn" style="margin-left:auto;">Search</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Django loop through users -->
                <tr>
                    <td>John Doe</td>
                    <td>Active</td>
                    <td>
                        <a href="#" class="btn btn-secondary">Block</a>
                        <a href="#" class="btn">View Details</a>
                    </td>
                </tr>
                <!-- repeat rows -->
            </tbody>
        </table>
    </div>
</body>
</html>
